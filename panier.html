<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Panier — ByA Bracelets</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" type="image/png" href="images/logo.png">
</head>
<body>

  <header>
    <a href="index.html" class="logo">
      <img src="images/logo.png" alt="Bracelets By.A" />
    </a>
    <nav>
      <a href="boutique.html">Boutique</a>
      <a href="contact.html">Contact</a>
      <a href="panier.html" class="icone-panier">
        🛒 <span id="compteur-panier">0</span>
      </a>
    </nav>
  </header>

  <section class="panier-page">
    <h2>Mon panier</h2>

    <div id="message-merci" class="message-merci" style="display:none;">
      🎉 Merci pour ta commande ! Tu vas recevoir un email de confirmation.
    </div>

    <div id="liste-panier">
      <!-- Rempli automatiquement par panier.js -->
    </div>

    <div id="panier-vide" style="display:none;">
      <p>Ton panier est vide.</p>
      <a href="boutique.html" class="bouton">Continuer mes achats</a>
    </div>

    <div id="resume-panier">
      <div class="zone-livraison">
        <label for="zone-livraison">Où dois-je livrer ta commande ?</label>
        <select id="zone-livraison">
          <option value="">— Choisis ta zone —</option>
          <option value="bruxelles">Bruxelles — 1,50 €</option>
          <option value="belgique">Belgique — 3,80 €</option>
          <option value="europe">France, Pays-Bas, Luxembourg — 4,60 €</option>
        </select>
        <small>Les frais de livraison sont ajoutés sur la page de paiement.</small>
      </div>

      <p>Total articles : <strong id="total-panier">0,00 €</strong></p>
      <button id="bouton-payer" onclick="passerCommande()">
        Payer maintenant
      </button>
    </div>

  </section>

  <footer>
    <p>© 2026 ByA Bracelets — Belgique</p>
  </footer>

  <script src="panier.js"></script>

</body>
</html>
