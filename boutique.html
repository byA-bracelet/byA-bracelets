<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Boutique — ByA Bracelets</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <a href="index.html" class="logo">
  <img src="images/logo.png" alt="Bracelets By.A" />
</a>
    <nav>
      <a href="index.html">Accueil</a>
      <a href="boutique.html">Boutique</a>
      <a href="contact.html">Contact</a>
      <a href="panier.html" class="icone-panier">
        🛒 <span id="compteur-panier">0</span>
      </a>
    </nav>
  </header>

  <section class="boutique">
    <h2>Notre collection</h2>

    <div class="produits">

      <div class="carte">
        <img src="images/bracelet1.jpg" alt="Bracelet Doré" />
        <h3>Bracelet Doré</h3>
        <p>Un bracelet élégant fait à la main.</p>
        <p class="prix">15,00 €</p>
        <button onclick="ajouterAuPanier('Bracelet Doré', 15.00)">
          Ajouter au panier
        </button>
      </div>

      <div class="carte">
        <img src="images/bracelet2.jpg" alt="Bracelet Argent" />
        <h3>Bracelet Argent</h3>
        <p>Délicat et raffiné, parfait au quotidien.</p>
        <p class="prix">12,00 €</p>
        <button onclick="ajouterAuPanier('Bracelet Argent', 12.00)">
          Ajouter au panier
        </button>
      </div>

      <div class="carte">
        <img src="images/bracelet3.jpg" alt="Bracelet Perles" />
        <h3>Bracelet Perles</h3>
        <p>Perles naturelles, style bohème.</p>
        <p class="prix">18,00 €</p>
        <button onclick="ajouterAuPanier('Bracelet Perles', 18.00)">
          Ajouter au panier
        </button>
      </div>

    </div>
  </section>

  <footer>
    <p>© 2026 ByA Bracelets — Fait en Belgique</p>
  </footer>

  <script src="panier.js"></script>

</body>
</html>
