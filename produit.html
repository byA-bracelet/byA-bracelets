<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Produit — Bracelets By.A</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" type="image/png" href="images/logo.png">
</head>
<body>

  <header>
    <a href="index.html" class="logo">
      <img src="images/logo.png" alt="Bracelets By.A" />
    </a>
    <nav>
      <a href="boutique.html">Boutique</a>
      <a href="contact.html">Contact</a>
      <a href="panier.html" class="icone-panier">
        🛒 <span id="compteur-panier">0</span>
      </a>
    </nav>
  </header>

  <section class="page-produit">
    <div class="produit-image">
      <img id="produit-photo" src="" alt="" />
    </div>
    <div class="produit-info">
      <h2 id="produit-nom"></h2>
      <p id="produit-stock" class="stock">Chargement du stock…</p>
      <p class="produit-prix" id="produit-prix"></p>
      <button id="produit-bouton" onclick="ajouterDepuisPage()" disabled>
        Ajouter au panier
      </button>
      <a href="boutique.html" class="retour">← Retour à la boutique</a>
    </div>
  </section>

  <footer>
    <p>© 2026 Bracelets By.A — Belgique</p>
  </footer>

  <script src="panier.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const nom = params.get('nom');
    const photo = params.get('photo');
    let prix = parseFloat(params.get('prix'));
    let stockServeur = 0;

    const stockEl = document.getElementById('produit-stock');
    const bouton = document.getElementById('produit-bouton');

    document.getElementById('produit-nom').textContent = nom;
    document.getElementById('produit-prix').textContent = prix.toFixed(2) + ' €';
    document.getElementById('produit-photo').src = 'images/' + photo;
    document.getElementById('produit-photo').alt = nom;
    document.title = nom + ' — Bracelets By.A';

    function griser() {
      bouton.disabled = true;
      bouton.style.backgroundColor = '#ccc';
      bouton.style.cursor = 'not-allowed';
    }

    async function chargerStock() {
      try {
        const reponse = await fetch(API + '/produits');
        const produits = await reponse.json();
        const produit = produits.find(p => p.nom === nom);

        if (!produit) {
          stockEl.textContent = 'Produit indisponible';
          stockEl.style.color = 'red';
          griser();
          return;
        }

        prix = Number(produit.prix);
        stockServeur = produit.stock;
        document.getElementById('produit-prix').textContent = prix.toFixed(2) + ' €';

        if (stockServeur === 0) {
          stockEl.textContent = '❌ Rupture de stock';
          stockEl.style.color = 'red';
          griser();
        } else if (stockServeur <= 3) {
          stockEl.textContent = '⚠️ Plus que ' + stockServeur + ' en stock !';
          stockEl.style.color = '#ffa500';
          bouton.disabled = false;
        } else {
          stockEl.textContent = '✅ En stock';
          stockEl.style.color = 'green';
          bouton.disabled = false;
        }
      } catch (erreur) {
        stockEl.textContent = 'Stock indisponible, réessaie dans un instant.';
        stockEl.style.color = 'red';
        griser();
      }
    }

    function ajouterDepuisPage() {
      const dejaDansPanier = (panier.find(item => item.nom === nom) || { quantite: 0 }).quantite;
      if (dejaDansPanier + 1 > stockServeur) {
        alert('Tu as déjà tout le stock disponible de ce bracelet dans ton panier.');
        return;
      }
      ajouterAuPanier(nom, prix);
    }

    chargerStock();
  </script>

</body>
</html>
